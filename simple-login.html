<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - E-Commerce</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            max-width: 400px;
            width: 100%;
        }
        
        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        
        .login-header i {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        
        .login-body {
            padding: 2rem;
        }
        
        .form-control {
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            color: white;
            transition: all 0.3s ease;
        }
        
        .btn-login:hover {
            background: linear-gradient(135deg, #5a6fd8 0%, #6b5b95 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .form-check-input:checked {
            background-color: #667eea;
            border-color: #667eea;
        }
        
        .alert {
            border-radius: 10px;
            border: none;
        }
        
        .text-primary-custom {
            color: #667eea !important;
        }
        
        .input-group .btn {
            border-radius: 0 10px 10px 0;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <!-- Header -->
            <div class="login-header">
                <i class="fas fa-shopping-cart"></i>
                <h3 class="mb-0">E-Commerce Store</h3>
                <p class="mb-0">Welcome Back!</p>
            </div>
            
            <!-- Body -->
            <div class="login-body">
                <!-- Alerts -->
                <div id="alert-container"></div>
                
                <!-- Login Form -->
                <form id="loginForm">
                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label">
                            <i class="fas fa-envelope me-2"></i>Email Address
                        </label>
                        <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                        <div class="invalid-feedback">Please provide a valid email address.</div>
                    </div>
                    
                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label">
                            <i class="fas fa-lock me-2"></i>Password
                        </label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                            <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="invalid-feedback">Please provide your password.</div>
                    </div>
                    
                    <!-- Remember Me & Forgot Password -->
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">
                                Remember me
                            </label>
                        </div>
                        <a href="#" class="text-primary-custom text-decoration-none" data-bs-toggle="modal" data-bs-target="#forgotModal">
                            Forgot Password?
                        </a>
                    </div>
                    
                    <!-- Login Button -->
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-login btn-lg" id="loginBtn">
                            <span class="spinner-border spinner-border-sm me-2 d-none" id="loginSpinner"></span>
                            <i class="fas fa-sign-in-alt me-2"></i>
                            Sign In
                        </button>
                    </div>
                </form>
                
                <!-- Social Login -->
                <div class="text-center">
                    <p class="text-muted mb-3">Or continue with</p>
                    <div class="d-grid gap-2">
                        <button class="btn btn-outline-danger">
                            <i class="fab fa-google me-2"></i>Login with Google
                        </button>
                        <button class="btn btn-outline-primary">
                            <i class="fab fa-facebook me-2"></i>Login with Facebook
                        </button>
                    </div>
                </div>
                
                <!-- Sign Up Link -->
                <div class="text-center mt-4">
                    <p class="text-muted">
                        Don't have an account? 
                        <a href="#" class="text-primary-custom text-decoration-none fw-bold">Sign Up</a>
                    </p>
                </div>
                
                <!-- Demo Info -->
                <div class="text-center mt-3">
                    <small class="text-muted">
                        <strong>Demo:</strong> admin@ecommerce.com / admin123
                    </small>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Forgot Password Modal -->
    <div class="modal fade" id="forgotModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-key me-2"></i>Reset Password
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted">Enter your email address and we'll send you a link to reset your password.</p>
                    <div class="mb-3">
                        <label for="resetEmail" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="resetEmail" placeholder="Enter your email">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="sendResetBtn">
                        <i class="fas fa-paper-plane me-2"></i>Send Reset Link
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        $(document).ready(function() {
            console.log('✅ Login form loaded successfully!');
            
            // Password toggle
            $('#togglePassword').click(function() {
                const passwordField = $('#password');
                const icon = $(this).find('i');
                
                if (passwordField.attr('type') === 'password') {
                    passwordField.attr('type', 'text');
                    icon.removeClass('fa-eye').addClass('fa-eye-slash');
                } else {
                    passwordField.attr('type', 'password');
                    icon.removeClass('fa-eye-slash').addClass('fa-eye');
                }
            });
            
            // Form validation and submission
            $('#loginForm').submit(function(e) {
                e.preventDefault();
                
                const email = $('#email').val().trim();
                const password = $('#password').val();
                
                // Clear previous alerts
                $('#alert-container').empty();
                
                // Validate
                if (!email || !validateEmail(email)) {
                    showAlert('Please enter a valid email address.', 'danger');
                    return;
                }
                
                if (!password || password.length < 6) {
                    showAlert('Password must be at least 6 characters.', 'danger');
                    return;
                }
                
                // Show loading
                const loginBtn = $('#loginBtn');
                const spinner = $('#loginSpinner');
                
                loginBtn.prop('disabled', true);
                spinner.removeClass('d-none');
                
                // Simulate login
                setTimeout(function() {
                    loginBtn.prop('disabled', false);
                    spinner.addClass('d-none');
                    
                    if (email === 'admin@ecommerce.com' && password === 'admin123') {
                        showAlert('✅ Login successful! Welcome back!', 'success');
                        
                        // Remember user if checked
                        if ($('#rememberMe').is(':checked')) {
                            localStorage.setItem('rememberedEmail', email);
                        }
                        
                    } else if (email === 'demo@test.com' && password === 'demo123') {
                        showAlert('✅ Demo login successful!', 'success');
                    } else {
                        showAlert('❌ Invalid email or password. Try admin@ecommerce.com / admin123', 'danger');
                    }
                }, 2000);
            });
            
            // Forgot password
            $('#sendResetBtn').click(function() {
                const email = $('#resetEmail').val().trim();
                
                if (!email || !validateEmail(email)) {
                    alert('Please enter a valid email address.');
                    return;
                }
                
                $(this).prop('disabled', true).html('<i class="fas fa-spinner fa-spin me-2"></i>Sending...');
                
                setTimeout(function() {
                    $('#forgotModal').modal('hide');
                    showAlert('Password reset link sent to your email!', 'success');
                    $('#sendResetBtn').prop('disabled', false).html('<i class="fas fa-paper-plane me-2"></i>Send Reset Link');
                    $('#resetEmail').val('');
                }, 2000);
            });
            
            // Load remembered email
            const rememberedEmail = localStorage.getItem('rememberedEmail');
            if (rememberedEmail) {
                $('#email').val(rememberedEmail);
                $('#rememberMe').prop('checked', true);
                $('#password').focus();
            }
            
            // Helper functions
            function validateEmail(email) {
                const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return regex.test(email);
            }
            
            function showAlert(message, type) {
                const alertHtml = `
                    <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                        ${message}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                `;
                $('#alert-container').html(alertHtml);
                
                // Auto hide after 5 seconds
                setTimeout(function() {
                    $('.alert').alert('close');
                }, 5000);
            }
        });
    </script>
</body>
</html>
